name: Project documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_outlook_reference:
        description: Run optional synthetic Outlook reference tests (no Microsoft access)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: project-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-docs:
    name: project-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verified pin
        with:
          persist-credentials: false
      - name: Validate project planning
        run: python3 scripts/check_project.py

  outlook-probe-tests:
    # Archived research only; not part of normal core development/CI.
    if: github.event_name == 'workflow_dispatch' && inputs.run_outlook_reference
    name: outlook-probe-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated probe dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ho001-venv"
          "$RUNNER_TEMP/ho001-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/outlook_probe/requirements.txt
      - name: Test synthetic probe scenarios without Microsoft access
        run: |
          "$RUNNER_TEMP/ho001-venv/bin/python" -m unittest discover -s scripts/outlook_probe -p 'test_*.py' -v
          "$RUNNER_TEMP/ho001-venv/bin/python" scripts/outlook_probe/probe.py plan
