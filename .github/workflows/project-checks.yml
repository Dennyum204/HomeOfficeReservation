name: Project documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-docs:
    name: project-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; verified pin
        with:
          persist-credentials: false
      - name: Validate project planning
        run: python3 scripts/check_project.py
