name: Core application
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  POSTGRES_PASSWORD: ci-synthetic-only
  HO_TEST_DATABASE: Host=localhost;Port=5432;Database=homeoffice;Username=homeoffice;Password=ci-synthetic-only;Timeout=3

jobs:
  pi-preparation:
    name: pi-preparation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # PR checkout normally uses a synthetic merge; archive labels must identify the actual head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Native ARM64 build and exact isolated Pi stack; no emulation or deployment
        run: sudo -E python3 infra/pi/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ho012-pi-images-${{ github.event.pull_request.head.sha || github.sha }}
          path: ho012-pi-images/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ho012-pi-runner-evidence
          path: |
            ho012-pi-evidence.json
            ho012-pi-runner-metrics.txt
          if-no-files-found: error
          retention-days: 14

  backend-contracts:
    name: backend-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ci-synthetic-only
      HO_TEST_DATABASE: Host=localhost;Port=5432;Database=homeoffice;Username=homeoffice;Password=ci-synthetic-only;Timeout=3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS' # Temurin API's exact SemVer for JDK 21.0.12+8
      - run: dotnet restore apps/api/HomeOffice.slnx --locked-mode
      - run: dotnet format apps/api/HomeOffice.slnx --no-restore --verify-no-changes
      - run: dotnet build apps/api/HomeOffice.slnx -c Release --no-restore
      - name: Native source encoding and debug-only transport configuration
        run: python3 scripts/check_native_config.py
      - name: Contract regeneration must match committed OpenAPI and both clients
        run: python3 scripts/generate_contracts.py --check
      - name: Start the documented PostgreSQL environment
        run: docker compose -f infra/compose.yaml up -d --wait
      - uses: ./.github/actions/setup-identity
      - name: Backend and real PostgreSQL integration tests
        run: dotnet test apps/api/HomeOffice.slnx -c Release --no-build --logger trx
      - name: Real process startup with database available and unavailable
        run: |
          python3 scripts/smoke_api.py --database
          python3 scripts/smoke_api.py
      - if: always()
        run: docker compose -f infra/compose.yaml down
      - name: Isolated production image, HTTPS, SMTP sink, restart and verified restore
        run: sudo -E python3 infra/pilot/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-preparation-evidence
          path: ho012-production-evidence.json
          if-no-files-found: error
          retention-days: 14

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - run: dotnet restore apps/api/HomeOffice.slnx --locked-mode
      - run: dotnet build apps/api/src/HomeOffice.Api -c Release --no-restore
      - uses: ./.github/actions/setup-identity
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser tests with real API and generated TypeScript client
        run: npm run test:e2e:auth && npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-evidence
          path: |
            apps/web/test-results/*.png
          retention-days: 14

  flutter-android:
    name: flutter-android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - run: dart pub get --enforce-lockfile && dart analyze
        working-directory: contracts/dart
      - name: Generated Dart date-only contract in Lisbon and Zurich (simulated HTTP)
        run: TZ=Europe/Lisbon dart run tool/date_contract.dart && TZ=Europe/Zurich dart run tool/date_contract.dart
        working-directory: contracts/dart
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Private signing path with disposable key; no APK publication or installation
        run: python3 scripts/check_android_signing.py
      - run: dart format --output=none --set-exit-if-changed lib/main.dart lib/config lib/features lib/theme test tool integration_test test_driver
        working-directory: apps/mobile
      - run: flutter analyze && flutter test
        working-directory: apps/mobile
      - name: Android planning date-only logic under both timezone settings (simulated HTTP)
        run: TZ=Europe/Lisbon flutter test test/planning_test.dart --plain-name date-only && TZ=Europe/Zurich flutter test test/planning_test.dart --plain-name date-only
        working-directory: apps/mobile
      - run: dotnet restore apps/api/HomeOffice.slnx --locked-mode
      - run: dotnet build apps/api/src/HomeOffice.Api -c Release --no-restore
      - uses: ./.github/actions/setup-identity
      - name: Real API connectivity using the Flutter repository and generated Dart client
        run: python3 scripts/smoke_api.py --dart-client
      - name: Android release compilation (unsigned, no deployment)
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid
        working-directory: apps/mobile
      - name: FCM native wiring compiles with synthetic external configuration (no delivery)
        run: python3 scripts/check_fcm_build.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local API for the Android emulator
        env:
          Auth__AccessTokenSeconds: '5'
          Auth__RefreshTokenSeconds: '30'
          Auth__RequestsPerMinute: '300'
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project apps/api/src/HomeOffice.Api -c Release --no-build --no-launch-profile --urls http://0.0.0.0:5080 > "$RUNNER_TEMP/android-api.log" 2>&1 &
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 3 http://localhost:5080/health/ready > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python3 scripts/prepare_invitation_test.py --base-url http://localhost:5080 --accounts "$RUNNER_TEMP/identity/accounts.json" --output "$RUNNER_TEMP/identity/client-test.json"
      - name: Observe Android transport and host resources without changing test behavior
        run: python3 scripts/android_ci_diagnostics.py --start
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            python3 scripts/wait_android_api.py --serial emulator-5554 --port 5080
            cd apps/mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart --no-dds -d emulator-5554 --dart-define=API_BASE_URL=http://10.0.2.2:5080 --dart-define-from-file="$RUNNER_TEMP/identity/client-test.json"
            cd apps/mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/notifications_test.dart --no-dds -d emulator-5554 --dart-define=API_BASE_URL=http://10.0.2.2:5080 --dart-define-from-file="$RUNNER_TEMP/identity/client-test.json"
            cd apps/mobile && flutter drive --driver=test_driver/planning.dart --target=integration_test/planning_test.dart --no-dds -d emulator-5554 --dart-define=API_BASE_URL=http://10.0.2.2:5080 --dart-define=TEST_EXPIRE_PLANNING_WRITE=true --dart-define-from-file="$RUNNER_TEMP/identity/client-test.json"
            cd apps/mobile && flutter drive --driver=test_driver/planning.dart --target=integration_test/work_test.dart --no-dds -d emulator-5554 --dart-define=API_BASE_URL=http://10.0.2.2:5080 --dart-define-from-file="$RUNNER_TEMP/identity/client-test.json"
            adb shell cmd alarm set-timezone Europe/Lisbon
            cd apps/mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/date_timezone_test.dart --no-dds -d emulator-5554 --dart-define=TEST_DEVICE_ZONE=Europe/Lisbon --dart-define=API_BASE_URL=http://10.0.2.2:5080 --dart-define-from-file="$RUNNER_TEMP/identity/client-test.json"
            adb shell cmd alarm set-timezone Europe/Zurich
            cd apps/mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/date_timezone_test.dart --no-dds -d emulator-5554 --dart-define=TEST_DEVICE_ZONE=Europe/Zurich --dart-define=API_BASE_URL=http://10.0.2.2:5080 --dart-define-from-file="$RUNNER_TEMP/identity/client-test.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-planning-evidence
          path: apps/mobile/test-results/*.png
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-transport-diagnostics
          path: ${{ runner.temp }}/android-transport.jsonl
          if-no-files-found: warn
          retention-days: 14
