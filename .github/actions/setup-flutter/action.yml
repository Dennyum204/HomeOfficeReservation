name: Pinned Flutter SDK
description: Install the verified stable Flutter Git revision and its bundled Dart SDK.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git clone --quiet --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
        test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "d3b14c876900e553bc736ca19295fc09e3853e8e"
        echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
        "$RUNNER_TEMP/flutter/bin/flutter" --version
