name: homeoffice
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: homeoffice
      POSTGRES_USER: homeoffice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create infra/.env from .env.example and set a local password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeoffice -d homeoffice"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
